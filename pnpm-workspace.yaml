overrides:
  '@react-types/shared': 3.35.0
  # Security patches for transitive dev/build deps (pnpm audit)
  undici: 7.28.0
  vite: 8.0.16
  postcss: 8.5.10
# PageUp/PageDown stepped by (max-min)/10, so the jump varied wildly per slider
# (10x, 18, or nothing). Patch makes calcPageSize use step*10 for a consistent jump.
patchedDependencies:
  '@react-stately/slider@3.7.5': patches/@react-stately__slider@3.7.5.patch
allowBuilds:
  '@firebase/util': true
  '@heroui/shared-utils': true
  '@sentry/cli': true
  protobufjs: true
  sharp: true
  unrs-resolver: true
publicHoistPattern:
  - '*@heroui/*'
  - '*@transience/color-picker/*'
minimumReleaseAgeExclude:
  - '@gilbarbara/*'
  - '@transience/*'
  - colorizr
